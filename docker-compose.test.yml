# docker-compose.test.yml — Oridecon integration test infrastructure
#
# All services run on non-standard ports to avoid conflicts with dev services.
#
# ─── Profiles ─────────────────────────────────────────────────────────────────
#
#   core       — postgres + redis  (oridecon-sql, oridecon-cache, oridecon-auth)
#   messaging  — kafka             (oridecon-events, oridecon-queue)
#   storage    — minio             (oridecon-storage)
#   search     — elasticsearch     (oridecon-search)
#   nosql      — mongo             (oridecon-nosql)
#   vector     — qdrant            (oridecon-vector)
#   graph      — neo4j             (oridecon-graph)
#   full       — all services
#
#   Usage:
#     docker compose -f docker-compose.test.yml --profile core up -d
#     docker compose -f docker-compose.test.yml --profile full up -d
#
# ─── Connection strings (match IntegrationTestConfig defaults exactly) ────────
#
#   ORI_TEST_POSTGRES_DSN=postgresql+asyncpg://oridecon:oridecon@localhost:15432/oridecon_test
#   ORI_TEST_POSTGRES_DSN_RAW=postgresql://oridecon:oridecon@localhost:15432/oridecon_test
#   ORI_TEST_REDIS_URL=redis://localhost:16379/15
#   ORI_TEST_KAFKA_BOOTSTRAP=localhost:19092
#   ORI_TEST_MINIO_ENDPOINT=localhost:19000
#   ORI_TEST_MINIO_ACCESS_KEY=minioadmin
#   ORI_TEST_MINIO_SECRET_KEY=minioadmin
#   ORI_TEST_ELASTICSEARCH_URL=http://localhost:19200
#   ORI_TEST_MONGODB_DSN=mongodb://localhost:17017
#   ORI_TEST_QDRANT_URL=http://localhost:16333
#   ORI_TEST_NEO4J_URL=bolt://localhost:17687
#   ORI_TEST_NEO4J_AUTH=neo4j/testpassword
#
# ─────────────────────────────────────────────────────────────────────────────

networks:
  oridecon-test:
    driver: bridge

volumes:
  oridecon_test_postgres:
  oridecon_test_redis:
  oridecon_test_mongo:
  oridecon_test_elasticsearch:
  oridecon_test_minio:
  oridecon_test_kafka:
  oridecon_test_qdrant:
  oridecon_test_neo4j_data:
  oridecon_test_neo4j_logs:

services:

  # ── PostgreSQL 16 ──────────────────────────────────────────────────────────
  # Profiles: core, full
  postgres:
    image: postgres:16-alpine
    restart: "no"
    networks:
      - oridecon-test
    ports:
      - "15432:5432"
    environment:
      POSTGRES_DB: oridecon_test
      POSTGRES_USER: oridecon
      POSTGRES_PASSWORD: oridecon
    volumes:
      - oridecon_test_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oridecon -d oridecon_test"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    profiles: [core, full]

  # ── Redis 7 ───────────────────────────────────────────────────────────────
  # Profiles: core, full
  redis:
    image: redis:7-alpine
    restart: "no"
    networks:
      - oridecon-test
    ports:
      - "16379:6379"
    volumes:
      - oridecon_test_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    profiles: [core, full]

  # ── MongoDB 7 ─────────────────────────────────────────────────────────────
  # Profiles: nosql, full
  mongo:
    image: mongo:7
    restart: "no"
    networks:
      - oridecon-test
    ports:
      - "17017:27017"
    volumes:
      - oridecon_test_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    profiles: [nosql, full]

  # ── Elasticsearch 8 (single-node, no security) ────────────────────────────
  # Profiles: search, full
  elasticsearch:
    image: elasticsearch:8.13.0
    restart: "no"
    networks:
      - oridecon-test
    ports:
      - "19200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - oridecon_test_elasticsearch:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qv '\"status\":\"red\"'"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    profiles: [search, full]

  # ── MinIO ─────────────────────────────────────────────────────────────────
  # Profiles: storage, full
  minio:
    image: minio/minio:RELEASE.2024-03-21T23-13-43Z
    restart: "no"
    networks:
      - oridecon-test
    ports:
      - "19000:9000"   # S3 API
      - "19001:9001"   # Web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MC_HOST_local: "http://minioadmin:minioadmin@localhost:9000"
    command: server /data --console-address ":9001"
    volumes:
      - oridecon_test_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    profiles: [storage, full]

  # ── Kafka (KRaft mode — no Zookeeper) ─────────────────────────────────────
  # Profiles: messaging, full
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    restart: "no"
    networks:
      - oridecon-test
    ports:
      - "19092:9092"    # broker
      - "19093:9093"    # controller
    environment:
      # KRaft mode
      KAFKA_KRAFT_MODE: "true"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_NODE_ID: "1"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      # Listeners
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:19092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      # Cluster identity — fixed UUID so restarts are idempotent
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qg"
      # Tuning for test workloads
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    volumes:
      - oridecon_test_kafka:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    profiles: [messaging, full]

  # ── Qdrant v1.9.2 ─────────────────────────────────────────────────────────
  # Profiles: vector, full
  qdrant:
    image: qdrant/qdrant:v1.9.2
    restart: "no"
    networks:
      - oridecon-test
    ports:
      - "16333:6333"   # REST / HTTP
      - "16334:6334"   # gRPC
    volumes:
      - oridecon_test_qdrant:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    profiles: [vector, full]

  # ── Neo4j 5.19 (Bolt only, no auth) ───────────────────────────────────────
  # Profiles: graph, full
  neo4j:
    image: neo4j:5.19-community
    restart: "no"
    networks:
      - oridecon-test
    ports:
      - "17687:7687"   # Bolt
    environment:
      NEO4J_AUTH: none
    volumes:
      - oridecon_test_neo4j_data:/data
      - oridecon_test_neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    profiles: [graph, full]
