[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "oridecon-testing"
version = "0.1.000"
description = "Centralized testing infrastructure for Oridecon Framework - Fixtures, factories, and utilities"
readme = "README.md"
requires-python = ">=3.11"
keywords = [
    "testing",
    "pytest",
    "fixtures",
    "factories",
    "mocking",
    "async",
    "framework",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Framework :: Pytest",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = [
    "oridecon>=0.1.4",
    "oridecon-contracts>=0.1.4",
    "oridecon-sql>=0.1.4",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]
authors = [
    { name = "Oridecon Framework Team", email = "team@oridecon.dev" },
]
maintainers = [
    { name = "Oridecon Framework Team", email = "team@oridecon.dev" },
]

[project.license]
text = "MIT"

[project.optional-dependencies]
db = [
    "aiosqlite>=0.19.0",
    "asyncpg>=0.29.0",
]
web = [
    "httpx>=0.26.0",
    "httpx2>=2.0.0",
    "starlette>=0.28.0",
]
auth = [
    "oridecon-auth>=0.1.4",
]
cache = [
    "oridecon-cache>=0.1.4",
]
storage = [
    "oridecon-storage>=0.1.4",
]
dev = [
    "black>=23.0.0",
    "ruff>=0.16.4",
    "mypy>=1.0.0",
]
all = [
    "aiosqlite>=0.19.0",
    "asyncpg>=0.29.0",
    "httpx>=0.26.0",
    "httpx2>=2.0.0",
    "starlette>=0.28.0",
    "oridecon-auth>=0.1.4",
    "oridecon-cache>=0.1.4",
    "oridecon-storage>=0.1.4",
]
integration = [
    "asyncpg>=0.29.0",
    "aiosqlite>=0.19.0",
    "redis>=5.0.0",
    "aiokafka>=0.12.0",
    "motor>=3.3.0",
    "qdrant-client>=1.9.0",
    "neo4j>=5.18.0",
    "elasticsearch[async]>=8.12.0",
]

[project.urls]
Homepage = "https://oridecon.dev"
Repository = "https://github.com/dbtinoy-/oridecon"
Documentation = "https://docs.oridecon.dev"
Issues = "https://github.com/dbtinoy-/oridecon/issues"
Changelog = "https://github.com/dbtinoy-/oridecon/blob/main/CHANGELOG.md"

[project.entry-points.pytest11]
oridecon = "oridecon.testing.plugins.pytest"

[dependency-groups]
dev = [
    "black>=23.0.0",
    "ruff>=0.16.4",
    "mypy>=1.0.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]
integration = [
    { include-group = "test" },
    "asyncpg>=0.29.0",
    "aiosqlite>=0.19.0",
    "redis>=5.0.0",
    "aiokafka>=0.12.0",
    "motor>=3.3.0",
    "qdrant-client>=1.9.0",
    "neo4j>=5.18.0",
    "elasticsearch[async]>=8.12.0",
]

[tool.ruff]
extend = "../../pyproject.toml"
line-length = 88
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "TID252"]
# Compliance tests intentionally assert isinstance(exc, ...) in except blocks
# because the test must pass whether or not an exception is raised.
# pytest.raises() would fail if no exception is raised.
"src/oridecon/testing/compliance/*.py" = ["PT017"]
# Testing/helpers package: asserts are the domain; dummy creds are intentional fixtures
"src/**" = ["S101", "S105", "S106"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["oridecon"]
force-sort-within-sections = true

[tool.mypy]
python_version = "3.13"
namespace_packages = true
explicit_package_bases = true
mypy_path = ["src"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
overrides = [
    { module = "tests.*", ignore_errors = true },
    { module = "docs.*", ignore_errors = true },
    { module = "motor.motor_asyncio", ignore_missing_imports = true },
]

[tool.uv.sources.oridecon]
workspace = true

[tool.uv.sources.oridecon-contracts]
workspace = true

[tool.uv.sources.oridecon-secrets]
workspace = true

[tool.uv.sources.oridecon-sql]
workspace = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = ["--cov=oridecon.testing", "--cov-report=html", "--cov-report=term", "--cov-fail-under=16"]
filterwarnings = [
    "ignore::pytest.PytestAssertRewriteWarning",
]
testpaths = ["tests"]
markers = [
    "integration: mark a test as an integration test",
    "scenario: marks cross-package scenario integration tests",
    "requires_redis: mark test as requiring Redis service",
    "requires_postgres: mark test as requiring PostgreSQL service",
    "requires_elasticsearch: mark test as requiring Elasticsearch service",
    "requires_rabbitmq: mark test as requiring RabbitMQ service",
    "requires_meilisearch: mark test as requiring Meilisearch service",
    "requires_smtp: mark test as requiring SMTP service",
    "requires_kafka: mark test as requiring Kafka service",
    "requires_minio: mark test as requiring MinIO service",
    "requires_mongodb: mark test as requiring MongoDB service",
    "requires_qdrant: mark test as requiring Qdrant service",
    "slow: mark test as slow running",
    "performance: mark test as a performance test",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/oridecon",
]
