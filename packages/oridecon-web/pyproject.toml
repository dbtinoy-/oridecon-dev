[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "oridecon-web"
version = "0.1.000"
description = "Web layer for Oridecon Framework - ASGI, routing, middleware, and API tooling"
readme = "README.md"
requires-python = ">=3.11"
keywords = [
    "web",
    "asgi",
    "api",
    "rest",
    "http",
    "routing",
    "middleware",
    "starlette",
    "async",
    "framework",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = [
    "oridecon>=0.1.4",
    "oridecon-contracts>=0.1.4",
    "starlette>=0.28.0",
    "orjson>=3.9.0",
    "typing-extensions>=4.0.0",
    "aiofiles>=23.0.0",
    "markupsafe>=2.1.5",
    "jinja2>=3.1.0",
]
authors = [
    { name = "Oridecon Framework Team", email = "team@oridecon.dev" },
]
maintainers = [
    { name = "Oridecon Framework Team", email = "team@oridecon.dev" },
]

[project.license]
text = "MIT"

[project.optional-dependencies]
granian = [
    "granian>=2.8.2",
]
uvicorn = [
    "uvicorn[standard]>=0.52.4",
]
hypercorn = [
    "hypercorn>=0.16.0",
]
security = [
    "itsdangerous>=2.0.0",
]
templates = [
    "jinja2>=3.1.0",
]
websocket = [
    "websockets>=17.1",
]
client = [
    "httpx>=0.26.0",
    "httpx2>=2.0.0",
]
docs = [
    "pyyaml>=6.0",
]
test = [
    "oridecon-testing>=0.1.4",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "httpx>=0.26.0",
    "httpx2>=2.0.0",
]
dev = [
    "black>=23.0.0",
    "ruff>=0.16.4",
    "mypy>=1.0.0",
    "types-aiofiles>=23.0.0",
]
all = [
    "granian>=2.8.2",
    "uvicorn[standard]>=0.52.4",
    "itsdangerous>=2.0.0",
    "jinja2>=3.1.0",
    "websockets>=17.1",
    "httpx>=0.26.0",
    "httpx2>=2.0.0",
    "pyyaml>=6.0",
    "oridecon-testing>=0.1.4",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]

[project.urls]
Homepage = "https://oridecon.dev"
Repository = "https://github.com/dbtinoy-/oridecon"
Documentation = "https://docs.oridecon.dev"
Issues = "https://github.com/dbtinoy-/oridecon/issues"
Changelog = "https://github.com/dbtinoy-/oridecon/blob/main/CHANGELOG.md"

[project.entry-points."oridecon.admin.contributors"]
web = "oridecon.web.admin.contributor:WebAdminContributor"

[project.entry-points."oridecon.providers"]
web = "oridecon.web.di.provider:WebProvider"

[project.entry-points."oridecon.config"]
web = "oridecon.web.config:WebConfig"

[project.entry-points."oridecon.cli.contributors"]
web = "oridecon.web.cli.contributor:WebCliContributor"

[project.entry-points."oridecon.modules"]
web = "oridecon.web.module:WebModule"

[project.entry-points."oridecon.servers"]
web = "oridecon.web.server.runner:run_server"

[project.entry-points."oridecon.web.contributors"]
# Empty by design — installed packages register here

[dependency-groups]
dev = [
    "black>=23.0.0",
    "ruff>=0.16.4",
    "mypy>=1.0.0",
    "types-aiofiles>=23.0.0",
]
test = [
    "oridecon-testing>=0.1.4",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "httpx>=0.26.0",
    "httpx2>=2.0.0",
]

[tool.ruff]
extend = "../../pyproject.toml"
line-length = 88
target-version = "py311"

[tool.ruff.lint]
extend-ignore = [
    "A001",  # builtin shadowed by function argument (e.g., `id`, `type`)
    "B004",  # using `hasattr()` to check for dunder — WSGI/ASGI compat
    "B007",  # loop variable not used in loop body
    "C416",  # unnecessary list comprehension — middleware patterns
    "PERF102",  # keys() on dict used only for membership check
    "PTH112",  # os.path.isdir should be replaced by Path.is_dir()
    "PTH113",  # os.path.isfile should be replaced by Path.is_file()
    "PTH118",  # os.path.join should be replaced by / operator
    "PTH204",  # os.path.getmtime should be replaced by Path.stat().st_mtime
    "RUF006",  # asyncio.create_task return not stored — fire-and-forget subscriptions
    "RUF022",  # `__all__` is not sorted — alphabetical sort not always logical
    "S704",  # markupsafe.Markup used intentionally in template rendering
    "TRY002",  # use Exception() instead of raise with no args
    "TRY203",  # useless try-except-pass
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["oridecon"]
force-sort-within-sections = true

[tool.mypy]
mypy_path = ["src"]
explicit_package_bases = true
namespace_packages = true
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[tool.pytest.ini_options]
addopts = ["--cov=oridecon.web", "--cov-report=html", "--cov-report=term", "--cov-fail-under=80"]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: mark a test as an integration test",
    "scenario: marks cross-package scenario integration tests",
    "requires_postgres: marks tests that require a live PostgreSQL connection",
]
pythonpath = [
    "src",
    "examples",
    "examples/structured_users/src",
    "examples/modular_platform/src",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/oridecon",
]
