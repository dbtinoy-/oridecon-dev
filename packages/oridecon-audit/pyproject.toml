[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oridecon-audit"
version = "0.1.000"
description = "Unified audit trail for the Oridecon Framework — append-only, HMAC-verified, retention-managed"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["oridecon", "audit", "logging", "compliance", "framework", "async", "python"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
authors = [{ name = "Oridecon Framework Team", email = "team@oridecon.dev" }]
maintainers = [{ name = "Oridecon Framework Team", email = "team@oridecon.dev" }]
dependencies = [
    "oridecon>=0.1.4",
    "oridecon-contracts>=0.1.4",
    "starlette>=0.28.0",
    "typer>=0.9.0",
]

[project.urls]
Homepage = "https://oridecon.dev"
Repository = "https://github.com/dbtinoy-/oridecon"
Documentation = "https://docs.oridecon.dev"
Issues = "https://github.com/dbtinoy-/oridecon/issues"
Changelog = "https://github.com/dbtinoy-/oridecon/blob/main/CHANGELOG.md"

[project.optional-dependencies]
sql = ["oridecon-sql>=0.1.4"]
test = [
    "oridecon-testing>=0.1.4",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]
dev = ["ruff>=0.16.4", "mypy>=1.0.0"]

[dependency-groups]
dev = ["ruff>=0.16.4", "mypy>=1.0.0"]
test = [
    "oridecon-testing>=0.1.4",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]

[project.entry-points."oridecon.modules"]
audit = "oridecon.audit.module:AuditModule"

[project.entry-points."oridecon.providers"]
audit = "oridecon.audit.di.bundle_provider:AuditBundleProvider"

[project.entry-points."oridecon.admin.contributors"]
audit = "oridecon.audit.admin.contributor:AuditAdminContributor"

[project.entry-points."oridecon.cli.contributors"]
audit = "oridecon.audit.cli.contributor:AuditCliContributor"

[tool.hatch.build.targets.wheel]
packages = ["src/oridecon"]

[tool.uv.sources]
oridecon = { workspace = true }
oridecon-contracts = { workspace = true }
oridecon-sql = { workspace = true }
oridecon-testing = { workspace = true }

[tool.mypy]
python_version = "3.11"
namespace_packages = true
explicit_package_bases = true
mypy_path = ["src"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
strict = true
show_error_codes = true
disallow_any_generics = true
overrides = [
    { module = "tests.*", ignore_errors = true },
]

[tool.ruff]
extend = "../../pyproject.toml"
line-length = 88
target-version = "py311"

[tool.ruff.lint]
extend-ignore = ["F823", "PYI034", "PYI046", "RUF059", "SIM103"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "TID252"]
"src/oridecon/audit/verification/checksum.py" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["oridecon"]
force-sort-within-sections = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: mark a test as an integration test",
    "scenario: marks cross-package scenario integration tests",
    "requires_postgres: marks tests that require a live PostgreSQL connection",
]
addopts = [
    "--cov=oridecon.audit",
    "--cov-report=term",
    "--cov-report=html",
    "--cov-fail-under=80",
]
