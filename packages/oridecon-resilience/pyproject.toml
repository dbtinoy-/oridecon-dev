[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oridecon-resilience"
version = "0.1.000"
description = "Resilience patterns for the Oridecon Framework (circuit breaker, retry, bulkhead, rate limiting, throttle, fallback)"
readme = "README.md"
requires-python = ">=3.11"
keywords = [
    "resilience",
    "circuit-breaker",
    "retry",
    "bulkhead",
    "rate-limiting",
    "fault-tolerance",
    "async",
    "framework",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
authors = [
    { name = "Oridecon Framework Team", email = "team@oridecon.dev" },
]
maintainers = [
    { name = "Oridecon Framework Team", email = "team@oridecon.dev" },
]

# Pure Python + stdlib only — no external I/O libraries required.
dependencies = [
    "oridecon-contracts>=0.1.4",
    "oridecon>=0.1.4",
]

[project.optional-dependencies]
idempotency-redis = ["oridecon-cache>=0.1.4"]
idempotency-database = ["oridecon-sql>=0.1.4"]
test = [
    "oridecon-testing>=0.1.4",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]
dev = [
    "ruff>=0.16.5",
    "mypy>=1.0.0",
]

[project.license]
text = "MIT"

[project.urls]
Homepage = "https://oridecon.dev"
Repository = "https://github.com/dbtinoy-/oridecon"
Documentation = "https://docs.oridecon.dev"
Issues = "https://github.com/dbtinoy-/oridecon/issues"
Changelog = "https://github.com/dbtinoy-/oridecon/blob/main/CHANGELOG.md"

# Framework packages are composed explicitly by the app module graph; entry-point
# plugin auto-discovery (oridecon.plugins) applies only to packages that register
# a PluginDescriptor under the "oridecon.plugins" entry-point group.
[project.entry-points."oridecon.providers"]
resilience = "oridecon.resilience.di.provider:ResilienceProvider"
idempotency = "oridecon.resilience.idempotency.provider:IdempotencyProvider"
durable_idempotency = "oridecon.resilience.idempotency.durable_provider:DurableIdempotencyProvider"

[project.entry-points."oridecon.cli.contributors"]
resilience = "oridecon.resilience.cli.contributor:ResilienceCliContributor"

[project.entry-points."oridecon.modules"]
resilience = "oridecon.resilience.module:ResilienceModule"

[dependency-groups]
test = [
    "oridecon-testing>=0.1.4",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]
dev = [
    "ruff>=0.16.5",
    "mypy>=1.0.0",
]

[tool.uv.sources.oridecon]
workspace = true

[tool.uv.sources.oridecon-contracts]
workspace = true

[tool.uv.sources.oridecon-testing]
workspace = true

[tool.ruff]
extend = "../../pyproject.toml"
line-length = 88
target-version = "py311"

[tool.ruff.lint]
extend-ignore = [
    "RUF022",  # __all__ not sorted — registration order is meaningful
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["oridecon"]
force-sort-within-sections = true

[tool.mypy]
python_version = "3.11"
namespace_packages = true
explicit_package_bases = true
mypy_path = ["src"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
overrides = [
    { module = "tests.*", ignore_errors = true },
]

[tool.pytest.ini_options]
addopts = ["--cov=oridecon.resilience", "--cov-report=term", "--cov-fail-under=50", "--import-mode=importlib"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: mark a test as an integration test",
    "scenario: marks cross-package scenario integration tests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/oridecon"]
