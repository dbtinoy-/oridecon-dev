[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oridecon-workflow"
version = "0.1.5009"
description = "Workflow orchestration for the Oridecon Framework (pipelines, bulk ops, sagas, graph engine)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["oridecon", "workflow", "orchestration", "saga", "framework", "async", "python"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
authors = [{ name = "Oridecon Framework Team", email = "team@oridecon.dev" }]
maintainers = [{ name = "Oridecon Framework Team", email = "team@oridecon.dev" }]

dependencies = [
    "oridecon-contracts>=0.1.4",
    "oridecon>=0.1.4",
    "typing-extensions>=4.0.0",
    "typer>=0.9.0",
]

[project.urls]
Homepage = "https://oridecon.dev"
Repository = "https://github.com/dbtinoy-/oridecon"
Documentation = "https://docs.oridecon.dev"
Issues = "https://github.com/dbtinoy-/oridecon/issues"
Changelog = "https://github.com/dbtinoy-/oridecon/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = [
    "oridecon-testing>=0.1.4",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]
dev = ["ruff>=0.16.4", "mypy>=1.0.0"]

[dependency-groups]
dev = ["ruff>=0.16.4", "mypy>=1.0.0"]
test = [
    "oridecon-testing>=0.1.4",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]

[project.entry-points."oridecon.modules"]
workflow = "oridecon.workflow.module:WorkflowModule"

[project.entry-points."oridecon.providers"]
workflow = "oridecon.workflow.di.provider:WorkflowProvider"

[project.entry-points."oridecon.cli.contributors"]
workflow = "oridecon.workflow.cli.contributor:WorkflowCliContributor"

[tool.hatch.build.targets.wheel]
packages = ["src/oridecon"]

[tool.uv.sources]
oridecon = { workspace = true }
oridecon-contracts = { workspace = true }
oridecon-testing = { workspace = true }

[tool.mypy]
python_version = "3.11"
namespace_packages = true
explicit_package_bases = true
mypy_path = ["src"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
strict = true
show_error_codes = true
overrides = [
    { module = "tests.*", ignore_errors = true },
]

[tool.ruff]
extend = "../../pyproject.toml"
line-length = 88
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["oridecon"]
force-sort-within-sections = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "--cov=oridecon.workflow",
    "--cov-report=term",
    "--cov-report=html",
    "--cov-fail-under=60",
]
markers = [
    "integration: marks tests as integration tests",
]
