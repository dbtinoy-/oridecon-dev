[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oridecon-notification"
version = "0.1.000"
description = "SMS, push, and email notification delivery with Named DI multi-backend support for the Oridecon Framework"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["oridecon", "notification", "alerts", "email", "push", "framework", "async", "python"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
authors = [{ name = "Oridecon Framework Team", email = "team@oridecon.dev" }]
maintainers = [{ name = "Oridecon Framework Team", email = "team@oridecon.dev" }]
dependencies = [
    "oridecon-contracts>=0.1.4",
    "oridecon>=0.1.4",
    "aiofiles>=23.0",
    "aiohttp>=3.9",
    "pywebpush>=2.5.0",
    "starlette>=0.28.0",
    "typer>=0.9.0",
]

[project.urls]
Homepage = "https://oridecon.dev"
Repository = "https://github.com/dbtinoy-/oridecon"
Documentation = "https://docs.oridecon.dev"
Issues = "https://github.com/dbtinoy-/oridecon/issues"
Changelog = "https://github.com/dbtinoy-/oridecon/blob/main/CHANGELOG.md"

[project.optional-dependencies]
sendgrid = ["sendgrid>=6.0"]
twilio = ["twilio>=8.0"]
apns = ["httpx[http2]>=0.27.0", "PyJWT>=2.8.0", "cryptography>=42.0.0"]
web-push = [
    "pywebpush>=2.5.0",
]
slack = ["httpx>=0.27.0", "slack-sdk>=3.0"]
whatsapp = ["httpx>=0.27.0"]
test = [
    "oridecon-testing>=0.1.4",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]
dev = ["ruff>=0.16.4", "mypy>=1.0.0"]

[dependency-groups]
dev = ["ruff>=0.16.4", "mypy>=1.0.0"]
test = [
    "oridecon-testing>=0.1.4",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]

[project.entry-points."oridecon.providers"]
mailer = "oridecon.notification.di.mailer_provider:MailerProvider"

[project.entry-points."oridecon.admin.contributors"]
notifications = "oridecon.notification.admin.contributor:NotificationAdminContributor"

[project.entry-points."oridecon.cli.contributors"]
notification = "oridecon.notification.cli.contributor:NotificationCliContributor"

[tool.hatch.build.targets.wheel]
packages = ["src/oridecon"]

[tool.uv.sources]
oridecon = { workspace = true }
oridecon-contracts = { workspace = true }
oridecon-testing = { workspace = true }

[tool.mypy]
python_version = "3.11"
namespace_packages = true
explicit_package_bases = true
mypy_path = ["src"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
strict = true
show_error_codes = true
overrides = [
    { module = "tests.*", ignore_errors = true },
]

[tool.ruff]
extend = "../../pyproject.toml"
line-length = 88
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["oridecon"]
force-sort-within-sections = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "--cov=oridecon.notification",
    "--cov-report=term",
    "--cov-report=html",
    "--cov-fail-under=40",
]
markers = [
    "integration: mark a test as an integration test",
    "scenario: marks cross-package scenario integration tests",
    "requires_smtp: marks tests that require an SMTP server",
]
