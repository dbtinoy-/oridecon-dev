[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "oridecon-search"
version = "0.1.000"
description = "Full-text search and indexing for Oridecon Framework - Elasticsearch, Meilisearch, and Algolia"
readme = "README.md"
requires-python = ">=3.11"
keywords = [
    "search",
    "elasticsearch",
    "meilisearch",
    "algolia",
    "full-text",
    "indexing",
    "async",
    "framework",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = [
    "oridecon>=0.1.4",
    "oridecon-contracts>=0.1.4",
    "typing-extensions>=4.0.0",
    "jinja2>=3.1.0",
]
authors = [
    { name = "Oridecon Framework Team", email = "team@oridecon.dev" },
]
maintainers = [
    { name = "Oridecon Framework Team", email = "team@oridecon.dev" },
]

[project.license]
text = "MIT"

[project.optional-dependencies]
elasticsearch = [
    "elasticsearch>=8.0.0",
]
meilisearch = [
    "meilisearch>=0.28.0",
]
algolia = [
    "algoliasearch>=3.0.0",
]
# Database-native search backends
postgres = [
    "asyncpg>=0.29.0",
]
mysql = [
    "aiomysql>=0.1.0",
]
sqlite = [
    "aiosqlite>=0.19.0",
]
mongodb = [
    "motor>=3.3.0",
]
# Bundles
database = [
    "asyncpg>=0.29.0",
    "aiomysql>=0.1.0",
    "aiosqlite>=0.19.0",
]
search-all = [
    "elasticsearch>=8.0.0",
    "meilisearch>=0.28.0",
    "algoliasearch>=3.0.0",
    "asyncpg>=0.29.0",
    "aiomysql>=0.1.0",
    "aiosqlite>=0.19.0",
    "motor>=3.3.0",
]
test = [
    "oridecon-testing>=0.1.4",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]
dev = [
    "black>=23.0.0",
    "ruff>=0.16.5",
    "mypy>=1.0.0",
]
all = [
    "elasticsearch>=8.0.0",
    "meilisearch>=0.28.0",
    "algoliasearch>=3.0.0",
    "oridecon-testing>=0.1.4",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]

[project.urls]
Homepage = "https://oridecon.dev"
Repository = "https://github.com/dbtinoy-/oridecon"
Documentation = "https://docs.oridecon.dev"
Issues = "https://github.com/dbtinoy-/oridecon/issues"
Changelog = "https://github.com/dbtinoy-/oridecon/blob/main/CHANGELOG.md"

[project.entry-points."oridecon.modules"]
SearchModule = "oridecon.search.module:SearchModule"

[project.entry-points."oridecon.config"]
search = "oridecon.search.config:SearchConfig"

[project.entry-points."oridecon.cli.contributors"]
search = "oridecon.search.cli.contributor:SearchCliContributor"

[project.entry-points."oridecon.admin.contributors"]
search = "oridecon.search.admin.contributor:SearchAdminContributor"

[dependency-groups]
dev = [
    "black>=23.0.0",
    "ruff>=0.16.5",
    "mypy>=1.0.0",
]
test = [
    "oridecon-testing>=0.1.4",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]

[tool.ruff]
extend = "../../pyproject.toml"
line-length = 88
target-version = "py311"

[tool.ruff.lint]
extend-ignore = [
    "E722",  # bare except — search backend fallback patterns
    "PLE0604",  # `*` used in `__all__` without `__all__` defined
    "RET504",  # unnecessary assignment before return — ORM building patterns
    "SIM118",  # use key in dict instead of key in dict.keys()
    "TC004",  # TYPE_CHECKING re-import — messaging protocol forwarding
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["oridecon"]
force-sort-within-sections = true

[tool.mypy]
python_version = "3.13"
mypy_path = ["src"]
namespace_packages = true
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
overrides = [
    { module = "meilisearch.*", ignore_missing_imports = true },
    { module = "tests.*", ignore_errors = true },
    { module = "docs.*", ignore_errors = true },
    { module = "motor.motor_asyncio", ignore_missing_imports = true },
    { module = "pymongo", ignore_missing_imports = true },
]

[tool.uv.sources.oridecon]
workspace = true

[tool.uv.sources.oridecon-testing]
workspace = true

[tool.uv.sources.oridecon-contracts]
workspace = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = ["--cov=oridecon.search", "--cov-report=term", "--cov-fail-under=40"]
testpaths = ["tests"]
markers = [
    "integration: mark a test as an integration test",
    "scenario: marks cross-package scenario integration tests",
    "requires_elasticsearch: marks tests that require a live Elasticsearch connection",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/oridecon",
]
