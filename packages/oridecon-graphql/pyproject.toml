[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "oridecon-graphql"
version = "0.1.000"
description = "GraphQL support for Oridecon Framework - Strawberry, Apollo Federation, and subscriptions"
readme = "README.md"
requires-python = ">=3.11"
keywords = [
    "graphql",
    "strawberry",
    "federation",
    "subgraph",
    "api",
    "schema",
    "async",
    "framework",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = [
    "oridecon>=0.1.4",
    "oridecon-contracts>=0.1.4",
    "strawberry-graphql>=0.235.0",
    "graphql-core>=3.2.0",
    "typing-extensions>=4.5.0",
    "starlette>=0.28.0",
    "jinja2>=3.1.0",
]
authors = [
    { name = "Oridecon Framework Team", email = "team@oridecon.dev" },
]
maintainers = [
    { name = "Oridecon Framework Team", email = "team@oridecon.dev" },
]

[project.license]
text = "MIT"

[project.optional-dependencies]
starlette = [
    "starlette>=0.28.0",
]
subscriptions = [
    "websockets>=12.0.0",
]
test = [
    "oridecon-testing>=0.1.4",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]
dev = [
    "black>=23.0.0",
    "ruff>=0.16.4",
    "mypy>=1.0.0",
]
all = [
    "starlette>=0.28.0",
    "websockets>=12.0.0",
    "oridecon-testing>=0.1.4",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]

[project.urls]
Homepage = "https://oridecon.dev"
Repository = "https://github.com/dbtinoy-/oridecon"
Documentation = "https://docs.oridecon.dev"
Issues = "https://github.com/dbtinoy-/oridecon/issues"
Changelog = "https://github.com/dbtinoy-/oridecon/blob/main/CHANGELOG.md"

[project.entry-points."oridecon.modules"]
GraphQLModule = "oridecon.graphql.module:GraphQLModule"

[project.entry-points."oridecon.config"]
graphql = "oridecon.graphql.config:GraphQLConfig"

[project.entry-points."oridecon.web.contributors"]
graphql = "oridecon.graphql.web.contributor:GraphQLWebContributor"

[dependency-groups]
dev = [
    "black>=23.0.0",
    "ruff>=0.16.4",
    "mypy>=1.0.0",
]
test = [
    "oridecon-testing>=0.1.4",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]

[tool.ruff]
extend = "../../pyproject.toml"
line-length = 88
target-version = "py311"

[tool.ruff.lint]
extend-ignore = [
    "A006",  # function argument shadows builtin — GraphQL resolver args
    "E731",  # lambda assignment — resolver shorthand patterns
    "F401",  # imported but unused — GraphQL schema re-exports
    "N818",  # exception name should be named with `Error` suffix
    "PYI034",  # `self` return without `Self` type — Protocol patterns
    "RUF006",  # asyncio.create_task return not stored — fire-and-forget subscriptions
    "RUF022",  # `__all__` is not sorted — alphabetical sort not always logical
    "SIM103",  # return condition directly (not always clearer)
    "TRY004",  # prefer TypeError instead of plain Exception
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["oridecon"]
force-sort-within-sections = true

[tool.mypy]
python_version = "3.11"
namespace_packages = true
explicit_package_bases = true
mypy_path = ["src"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
overrides = [
    { module = "tests.*", ignore_errors = true },
    { module = "docs.*", ignore_errors = true },
]

[tool.uv.sources.oridecon]
workspace = true

[tool.uv.sources.oridecon-testing]
workspace = true

[tool.uv.sources.oridecon-contracts]
workspace = true

[tool.pytest.ini_options]
addopts = ["--cov=oridecon.graphql", "--cov-report=html", "--cov-report=term", "--cov-fail-under=75"]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = [
    "integration: mark a test as an integration test",
    "scenario: marks cross-package scenario integration tests",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/oridecon",
]

[project.entry-points."oridecon.cli.contributors"]
graphql = "oridecon.graphql.cli.contributor:GraphQLCliContributor"
