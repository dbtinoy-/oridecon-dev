[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "oridecon-sql"
version = "0.1.000"
description = "SQL database abstractions for Oridecon Framework — Postgres, MySQL, SQLite with migrations, repositories, and query building"
readme = "README.md"
requires-python = ">=3.11"
keywords = [
    "database",
    "sqlalchemy",
    "orm",
    "migrations",
    "alembic",
    "postgres",
    "mysql",
    "sqlite",
    "sql",
    "async",
    "framework",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = [
    "oridecon>=0.1.4",
    "oridecon-contracts>=0.1.4",
    "typing-extensions>=4.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.17.2",
    "aiosqlite>=0.22.1",
    "jinja2>=3.1.0",
    "typer>=0.9.0",
    "anyio>=4.0.0",
]
authors = [
    { name = "Oridecon Framework Team", email = "team@oridecon.dev" },
]
maintainers = [
    { name = "Oridecon Framework Team", email = "team@oridecon.dev" },
]

[project.license]
text = "MIT"

[project.optional-dependencies]
postgres = [
    "asyncpg>=0.29.0",
]
mysql = [
    "aiomysql>=0.1.0",
]
sqlite = [
    "aiosqlite>=0.22.1",
]

test = [
    "oridecon-testing>=0.1.4",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]
dev = [
    "black>=23.0.0",
    "ruff>=0.16.5",
    "mypy>=1.0.0",
]
all = [
    "asyncpg>=0.29.0",
    "aiomysql>=0.1.0",
    "aiosqlite>=0.19.0",
    "oridecon-testing>=0.1.4",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]

[project.urls]
Homepage = "https://oridecon.dev"
Repository = "https://github.com/dbtinoy-/oridecon"
Documentation = "https://docs.oridecon.dev"
Issues = "https://github.com/dbtinoy-/oridecon/issues"
Changelog = "https://github.com/dbtinoy-/oridecon/blob/main/CHANGELOG.md"

[project.entry-points."oridecon.admin.contributors"]
sql = "oridecon.sql.admin.contributor:SqlAdminContributor"

[project.entry-points."oridecon.providers"]
database = "oridecon.sql.di.provider:DatabaseProvider"

[project.entry-points."oridecon.config"]
database = "oridecon.sql.config:DatabaseConfig"

[project.entry-points."oridecon.cli.contributors"]
sql = "oridecon.sql.cli.contributor:SqlCliContributor"

[dependency-groups]
dev = [
    "black>=23.0.0",
    "ruff>=0.16.5",
    "mypy>=1.0.0",
    "oridecon-testing>=0.1.4",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]

[tool.ruff]
extend = "../../pyproject.toml"
line-length = 88
target-version = "py311"

[tool.ruff.lint]
extend-ignore = [
    "A001",  # builtin shadowed by function argument (e.g., `id`, `type`)
    "EXE001",  # shebang is present but file is executable — migration scripts
    "F823",  # undefined `__all__` member — alembic/SQLAlchemy patterns
    "N818",  # exception name should be named with `Error` suffix
    "PYI021",  # docstring in stub — generated stub files
    "PYI036",  # `__exit__` return type — Protocol stubs
    "RET503",  # missing explicit return at end of function — sqlalchemy patterns
    "RET504",  # unnecessary assignment before return — ORM building patterns
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["oridecon"]
force-sort-within-sections = true

[tool.mypy]
python_version = "3.11"
namespace_packages = true
explicit_package_bases = true
mypy_path = ["src"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
overrides = [
    { module = "tests.*", ignore_errors = true },
    { module = "docs.*", ignore_errors = true },
    { module = "asyncpg", ignore_missing_imports = true },
    { module = "aiomysql", ignore_missing_imports = true },
    { module = "yaml", ignore_missing_imports = true },
]

[tool.uv.sources.oridecon]
workspace = true

[tool.uv.sources.oridecon-admin]
workspace = true

[tool.uv.sources.oridecon-testing]
workspace = true

[tool.uv.sources.oridecon-contracts]
workspace = true

[tool.pytest.ini_options]
addopts = ["--cov=oridecon.sql", "--cov-report=html", "--cov-report=term", "--cov-fail-under=60"]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "integration: mark a test as an integration test",
    "scenario: marks cross-package scenario integration tests",
    "requires_postgres: marks tests that require a live PostgreSQL connection",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/oridecon",
]
