[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "oridecon-tasks"
version = "0.1.5011"
description = "Background task processing for Oridecon Framework - Scheduling, workers, and job queues"
readme = "README.md"
requires-python = ">=3.11"
keywords = [
    "tasks",
    "background",
    "jobs",
    "scheduling",
    "workers",
    "queue",
    "cron",
    "async",
    "framework",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = [
    "oridecon>=0.1.4",
    "oridecon-contracts>=0.1.4",
    "typing-extensions>=4.0.0",
    "croniter>=1.4.0",
    "psutil>=5.9.0",
    "typer>=0.9.0",
    "jinja2>=3.1.0",
]
authors = [
    { name = "Oridecon Framework Team", email = "team@oridecon.dev" },
]
maintainers = [
    { name = "Oridecon Framework Team", email = "team@oridecon.dev" },
]

[project.license]
text = "MIT"

[project.optional-dependencies]
redis = [
    "redis>=5.0.0",
    "rq>=1.15.0",
]
rabbitmq = [
    "aio-pika>=9.3.0",
    "pika>=1.3.0",
]
test = [
    "oridecon-testing>=0.1.4",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]
dev = [
    "black>=23.0.0",
    "ruff>=0.16.4",
    "mypy>=1.0.0",
    "types-croniter>=2.0.0",
]
all = [
    "redis>=5.0.0",
    "rq>=1.15.0",
    "aio-pika>=9.3.0",
    "pika>=1.3.0",
    "oridecon-testing>=0.1.4",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]

[project.urls]
Homepage = "https://oridecon.dev"
Repository = "https://github.com/dbtinoy-/oridecon"
Documentation = "https://docs.oridecon.dev"
Issues = "https://github.com/dbtinoy-/oridecon/issues"
Changelog = "https://github.com/dbtinoy-/oridecon/blob/main/CHANGELOG.md"

[project.entry-points."oridecon.admin.contributors"]
tasks = "oridecon.tasks.admin.contributor:TasksAdminContributor"

[project.entry-points."oridecon.modules"]
tasks = "oridecon.tasks.module:TasksModule"

[project.entry-points."oridecon.config"]
tasks = "oridecon.tasks.config:TaskConfig"

[project.entry-points."oridecon.cli.contributors"]
tasks = "oridecon.tasks.cli.contributor:TasksCliContributor"

[dependency-groups]
dev = [
    "black>=23.0.0",
    "ruff>=0.16.4",
    "mypy>=1.0.0",
    "types-croniter>=2.0.0",
]
test = [
    "oridecon-testing>=0.1.4",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]

[tool.ruff]
extend = "../../pyproject.toml"
line-length = 88
target-version = "py311"

[tool.ruff.lint]
extend-select = [
    "D1",   # pydocstyle — missing public docstrings (D100-D107)
]
extend-ignore = [
    "D107",  # Missing docstring in `__init__` — documented at class level
    "PLE0604",  # `*` used in `__all__` without `__all__` defined
    "PLE0605",  # `*` import from non-module
    "PYI036",  # `__exit__` return type — Protocol stubs
    "PYI056",  # calling `.append()` and `.extend()` in `__init_subclass__`
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "TID252"]
"src/oridecon/tasks/scheduling/persistence.py" = ["TID251"]
"src/oridecon/tasks/workflows/state.py" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["oridecon"]
force-sort-within-sections = true

[tool.mypy]
python_version = "3.11"
namespace_packages = true
explicit_package_bases = true
mypy_path = ["src"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
overrides = [
    { module = "tests.*", ignore_errors = true },
    { module = "docs.*", ignore_errors = true },
    { module = "aio_pika.*", ignore_missing_imports = true },  # optional rabbitmq extra
]

[tool.uv.sources.oridecon]
workspace = true

[tool.uv.sources.oridecon-admin]
workspace = true

[tool.uv.sources.oridecon-testing]
workspace = true

[tool.pytest.ini_options]
addopts = ["--cov=oridecon.tasks", "--cov-report=html", "--cov-report=term", "--cov-fail-under=74"]
testpaths = ["tests"]
markers = [
    "integration: mark a test as an integration test",
    "scenario: marks cross-package scenario integration tests",
    "requires_redis: marks tests that require a live Redis connection",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/oridecon",
]
