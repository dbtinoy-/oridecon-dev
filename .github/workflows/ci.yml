name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed groups
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.groups.outputs.groups }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changes by group
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core: 'core/**'
            packages: 'packages/**'
            ai: 'experimental/ai/**'
            multimedia: 'experimental/multimedia/**'
            apps: 'experimental/apps/**'
            shared: 'pyproject.toml|uv.lock|Makefile|dev/**|.github/**'

      - name: Compute affected groups
        id: groups
        shell: bash
        env:
          CORE: ${{ steps.filter.outputs.core }}
          PACKAGES: ${{ steps.filter.outputs.packages }}
          AI: ${{ steps.filter.outputs.ai }}
          MULTIMEDIA: ${{ steps.filter.outputs.multimedia }}
          APPS: ${{ steps.filter.outputs.apps }}
          SHARED: ${{ steps.filter.outputs.shared }}
          DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          # core is depended on by every other package, so core or shared
          # changing runs the full matrix; workflow_dispatch has no base
          # diff, so it always runs everything. Otherwise each group runs
          # on its own filter.
          run_all="false"
          [ "$CORE" = "true" ] && run_all="true"
          [ "$SHARED" = "true" ] && run_all="true"
          [ "$DISPATCH" = "true" ] && run_all="true"
          groups=""
          for g in core packages ai multimedia apps; do
            flag="${g^^}"
            if [ "$run_all" = "true" ] || [ "${!flag}" = "true" ]; then
              groups="$groups,$g"
            fi
          done
          if [ -z "$groups" ]; then
            echo "groups=[]" >> "$GITHUB_OUTPUT"
          else
            echo "groups=[\"${groups#,}\"]" | sed 's/,/","/g' >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: Quality gate (format, lint, types)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.11

      - name: install workspace (locked)
        run: uv sync --group tooling --group qa --group security --locked

      - name: format
        run: uv run ruff format --check .

      - name: lint
        run: uv run ruff check .

      - name: Tier boundary
        run: uv run python dev/checks/tier_boundary.py --root .

      - name: Dependency pin guard
        run: uv run python dev/checks/dep_pins.py --root .

      - name: LOC limit ratchet (500)
        run: uv run python dev/checks/loc_limit.py --root .

      - name: Stub-shadow gate (MRO resolution)
        run: uv run python dev/checks/stub_shadows.py --root .

      - name: Contracts protocol-surface gate
        run: uv run python dev/checks/protocol_surface.py --root .

      - name: Import boundaries (import-linter, namespace-aware)
        run: uv run python dev/checks/lint_imports.py

      - name: Import depth gate (max 6 segments)
        run: uv run python dev/checks/import_depth.py --max-depth 6

      - name: Datetime awareness gate (no bare datetime.now())
        run: uv run python dev/checks/datetime_awareness.py

      - name: UI trust boundary gate (no unallowlisted raw/Markup)
        run: uv run python dev/checks/ui_trusted_html.py

      - name: env.example coverage
        run: uv run python dev/checks/env_example.py --root .

      - name: env.example binding accuracy
        run: uv run python dev/checks/env_binding.py --example .env.example

      - name: typecheck
        run: make type

  tests:
    name: tests (${{ matrix.group }})
    needs: changes
    if: needs.changes.outputs.groups != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJson(needs.changes.outputs.groups) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.11

      - name: install workspace (locked)
        run: uv sync --group tooling --group qa --group security --locked

      - name: test
        shell: bash
        run: |
          set -euo pipefail
          # Map group names to actual tier-root paths
          case "${{ matrix.group }}" in
            ai)           TESTDIR="experimental/ai" ;;
            multimedia)   TESTDIR="experimental/multimedia" ;;
            apps)         TESTDIR="experimental/apps" ;;
            *)            TESTDIR="${{ matrix.group }}" ;;
          esac
          # DESELECT, re-keyed on tier-root paths: runs root at the tier root,
          # so node ids are <tier>/<package>/tests/...
          case "${{ matrix.group }}" in
            packages)
              DESELECT="--deselect packages/oridecon-monitor/tests/unit/test_channel_dispatchers.py::TestSlackBusinessHoursDispatcher::test_queues_outside_business_hours --deselect packages/oridecon-nosql/tests/unit/test_document_repository_generator.py::TestDocumentRepositoryGenerator::test_generate_creates_file --deselect packages/oridecon-nosql/tests/unit/test_document_repository_generator.py::TestDocumentRepositoryGenerator::test_generate_no_force_skips_existing --deselect packages/oridecon-nosql/tests/unit/test_document_repository_generator.py::TestDocumentRepositoryGenerator::test_generate_with_fields_str --deselect packages/oridecon-queue/tests/unit/test_message_consumer_generator.py::test_message_consumer_generator_fields"
              ;;
            *)
              DESELECT=""
              ;;
          esac
          uv run pytest -q -m "not integration" --no-cov "$TESTDIR" $DESELECT

  integration:
    name: Integration scenarios (postgres + redis)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.11

      - name: install workspace (locked)
        run: uv sync --group tooling --group qa --group security --locked

      - name: Start backing services (postgres, redis)
        run: |
          docker compose -f tests/docker-compose.yml --profile core up -d
          ./tests/wait-for-services.sh

      - name: integration scenarios
        shell: bash
        env:
          ADMIN_SETUP_TOKEN: ci-integration-token
        run: |
          timeout 480 uv run pytest tests/integration/scenarios -m integration --no-cov -q

  coverage:
    name: Coverage gate (aggregate)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.11

      - name: install workspace (locked)
        run: uv sync --group tooling --group qa --group security --locked

      - name: coverage test
        run: |
          uv run pytest -m "not integration and not slow" --cov --cov-fail-under=70

  example:
    name: Examples gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.11

  browser:
    name: Browser gate (Playwright, admin UI)
    needs: changes
    if: needs.changes.outputs.groups != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.11

      - name: install workspace (locked)
        run: uv sync --group tooling --group qa --group security --locked

      - name: Install Playwright Chromium (+ system deps)
        run: uv run playwright install --with-deps chromium

      - name: browser tests (fail, not skip, when tooling is missing)
        run: uv run pytest experimental/apps/oridecon-admin/tests/browser --browser-gate -q --no-cov

  aggregate:
    name: Required aggregate status
    if: always()
    needs:
      - quality
      - tests
      - integration
      - coverage
      - example
      - audit
      - browser
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job did not succeed (skips allowed)
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'timed_out')
        run: |
          echo "Required job failed: ${{ toJSON(needs.*.result) }}"
          exit 1

      - name: Aggregate status is green
        run: |
          echo "All required jobs passed: ${{ toJSON(needs.*.result) }}"

  example:
    name: Examples gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.11

      - name: test (demo suites, workspace env)
        run: uv run --group tooling pytest -q -m "not integration" --no-cov examples/event-driven-orders/tests examples/realtime-monitor/tests examples/resilient-rates/tests examples/rag-docs/tests examples/auth-web/tests examples/auth-rbac/tests examples/auth-mfa/tests examples/auth-apikeys/tests

      - name: compile (demo scripts)
        run: uv run python -m compileall -q examples/event-driven-orders examples/realtime-monitor examples/resilient-rates

      - name: smoke (execute demo entry points)
        run: make smoke-examples

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.11

      - name: install workspace (locked)
        run: uv sync --group tooling --group qa --group security --locked

      - name: audit (pip-audit)
        run: uv run pip-audit