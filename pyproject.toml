# Virtual workspace root - no [project] table.
# The root is not a distribution (oridecon-workspace is unpublished); all 54
# packages are workspace members discovered via the globs below. Project
# metadata that lived here (see git history for the project.urls table) is kept as a
# comment to avoid forcing a dependency on the root project.
#   Homepage:       https://oridecon.dev
#   Repository:     https://github.com/dbtinoy-/oridecon
#   Documentation:  https://docs.oridecon.dev
#   Issues:         https://github.com/dbtinoy-/oridecon/issues
#   Changelog:      https://github.com/dbtinoy-/oridecon/blob/main/CHANGELOG.md



[tool.uv.workspace]
members = ["core/*", "packages/*", "experimental/*/*"]

[tool.uv]
# ace-step 0.1.0 pins gradio==5.23.3 (pillow<12 cap), which conflicts
# with the workspace dev-group pillow>=12.1.1 floor. gradio 6.15.1
# (already locked for f5-tts) drops the cap, so force it workspace-wide.
override-dependencies = ["gradio>=6.15.1", "diffusers==0.32.2", "transformers==4.50.0", "pytorch-lightning>=2.5.1", "torchaudio==2.9.0", "torch==2.9.0", "stable-audio-tools==0.0.20"]

