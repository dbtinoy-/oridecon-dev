[tool.ruff.lint.isort]
known-first-party = ["oridecon"]
force-sort-within-sections = true

[tool.ruff.lint.mccabe]
max-complexity = 15

# ---------------------------------------------------------------------------
# import-linter
# ---------------------------------------------------------------------------
# Configuration lives in .importlinter (INI format) at the repo root.
# Run boundary checks via the namespace-aware wrapper (required because
# grimp's standard package-finder cannot traverse pkgutil.extend_path
# namespace packages):
#
#   make lint-boundaries                       ← preferred Makefile target
#   uv run python dev/checks/lint_imports.py
#
# Do NOT use `uv run lint-imports` directly — it will fail to discover
# extension packages (oridecon.contracts, oridecon.cache, etc.).
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.11"
namespace_packages = true
explicit_package_bases = true
mypy_path = [
    "core/oridecon/src",
    "core/oridecon-contracts/src",
    "experimental/apps/oridecon-admin/src",
    "experimental/apps/oridecon-builder/src",
    "experimental/ai/oridecon-ai/src",
    "experimental/ai/oridecon-ai-agents/src",
    "experimental/ai/oridecon-ai-evaluation/src",
    "experimental/ai/oridecon-ai-feedback/src",
    "experimental/ai/oridecon-ai-governance/src",
    "experimental/ai/oridecon-ai-guard/src",
    "experimental/ai/oridecon-ai-llm/src",
    "experimental/ai/oridecon-ai-memory/src",
    "experimental/ai/oridecon-ai-observability/src",
    "experimental/ai/oridecon-ai-prompt/src",
    "experimental/ai/oridecon-ai-rag/src",
    "experimental/ai/oridecon-ai-relay/src",
    "experimental/ai/oridecon-ai-relay-gateway/src",
    "experimental/ai/oridecon-ai-session/src",
    "experimental/ai/oridecon-ai-skills/src",
    "experimental/ai/oridecon-ai-workers/src",
    "experimental/ai/oridecon-ai-mcp/src",
    "packages/oridecon-auth/src",
    "packages/oridecon-cache/src",
    "experimental/apps/oridecon-cli/src",
    "packages/oridecon-events/src",
    "packages/oridecon-features/src",
    "packages/oridecon-graphql/src",
    "packages/oridecon-http/src",
    "packages/oridecon-monitor/src",
    "packages/oridecon-nosql/src",
    "packages/oridecon-notification/src",
    "packages/oridecon-queue/src",
    "packages/oridecon-resilience/src",
    "packages/oridecon-search/src",
    "packages/oridecon-storage/src",
    "packages/oridecon-tasks/src",
    "packages/oridecon-secrets/src",
    "packages/oridecon-sql/src",
    "packages/oridecon-tenancy/src",
    "packages/oridecon-testing/src",
    "experimental/apps/oridecon-ui/src",
    "packages/oridecon-vector/src",
    "packages/oridecon-web/src",
    "packages/oridecon-workflow/src",
    "packages/oridecon-audit/src",
    "packages/oridecon-webhook/src",
    "packages/oridecon-graph/src",
    "experimental/multimedia/oridecon-multimedia/src",
    "experimental/multimedia/oridecon-multimedia-beat/src",
