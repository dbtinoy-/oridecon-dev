    "experimental/multimedia/oridecon-multimedia-tts/src",
    "experimental/multimedia/oridecon-multimedia-upscale/src",
    "experimental/multimedia/oridecon-multimedia-video/src",
]
warn_unused_ignores = true
exclude = [
    "experimental/apps/oridecon-cli/src/oridecon/cli/templates/.*",
    "core/oridecon-contracts/src/oridecon/__init__.py",
    "experimental/ai/oridecon-ai/src/oridecon/__init__.py",
    "experimental/apps/oridecon-admin/src/oridecon/__init__.py",
    "^tests/",
    "^docs/",
    "alembic/.*",
    "packages/.*/tests/",
    "experimental/.*/tests/",
]

