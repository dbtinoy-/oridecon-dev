[tool.coverage.run]
source = ["core", "packages", "experimental"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/conftest.py",
    "*/migrations/*",
    "*/__pycache__/*",
    "oridecon-cli/src/oridecon/cli/templates/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@\\(abc\\.\\)?abstractmethod",
    "if TYPE_CHECKING:",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.ruff]
# Oridecon Framework workspace-level ruff configuration.
# Sub-packages extend this config via `extend = "../pyproject.toml"`.
line-length = 88
target-version = "py311"
extend-exclude = [
    # Non-production directories: excluded entirely from linting
    "**/tests/**",
    "**/docs/**",
    "**/migrations/**",
    "**/alembic/**",
    "**/templates/**",
    # Root-level helper directories: dev tooling, not production code
    "dev",
    "dev/**",
    "tools",
    "tools/**",
    # Benchmarks are not production source
    "benchmarks/**",
]

[tool.ruff.lint]
# Enable a comprehensive rule set for the whole framework
select = [
    "PLC",   # Pylint convention
    "PLE",   # Pylint errors
    "PLR",   # Pylint refactoring
    "PLW",   # Pylint warnings
    "F",     # Pyflakes
    "E",     # Pycodestyle errors
    "W",     # Pycodestyle warnings
    "C90",   # Complexity (mccabe)
    "N",     # PEP8 naming
    "UP",    # Pyupgrade
    "ASYNC", # Async considerations
    "B",     # Flake8-bugbear
    "C4",    # Flake8-comprehensions
    "COM",   # Flake8-commas
    "ICN",   # Flake8-import-conventions
    "PIE",   # Flake8-pie
    "SIM",   # Flake8-simplify
    "TID",   # Flake8-tidy-imports
    "ARG",   # Flake8-unused-arguments
    "S",     # Flake8-bandit (security)
    "BLE",   # Flake8-blind-except
    "RSE",   # Flake8-raise
    "RET",   # Flake8-return
    "SLF",   # Flake8-self
    "TRY",   # Tryceratops
    "LOG",   # Flake8-logging
    "G",     # Flake8-logging-format
    "PERF",  # Perflint
    "PT",    # Flake8-pytest-style
    "FA",    # Flake8-future-annotations
    "TCH",   # Flake8-type-checking
    "FLY",   # Flynt
    "ERA",   # Eradicate
    "PTH",   # Flake8-use-pathlib
    "A",     # Flake8-builtins
    "FBT",   # Flake8-boolean-trap
    "RUF",   # Ruff-specific rules
    "PGH",   # Pygrep-hooks
    "YTT",   # Flake8-2020
    "DJ",    # Flake8-django
    "EM",    # Flake8-errmsg
    "EXE",   # Flake8-executable
    "ISC",   # Flake8-implicit-string-concat
    "INP",   # Flake8-no-pep420
    "T20",   # Flake8-print
    "PYI",   # Flake8-pyi
    "Q",     # Flake8-quotes
    "SLOT",  # Flake8-slots
    "INT",   # Flake8-gettext
    "PD",    # Pandas-vet
    "NPY",   # Numpy-deprecated
    "AIR",   # Airflow
    "I",     # Isort
]

ignore = [
    # ── Formatter Conflicts (official ruff recommendation) ──
    "COM812",  # trailing comma missing — conflicts with ruff format
    "ISC001",  # single-line implicit string concat — conflicts with ruff format

    # ── Dependency Injection / Framework Constructors ──
    "PLR0917", # too many positional arguments — DI constructors legitimately
               # take many services; introduced as an error in ruff 0.16.x

    # ── Blind Except (fault-tolerance patterns use broad catches) ──
    "BLE001",  # do not catch blind exception

    # ── Lazy Loading / DI / ORM Patterns ──
    "E402",    # module-level import not at top of file
    "PLC0415", # import not at top of module — lazy loading for DI
    "F822",    # undefined name in `__all__` — lazy registration patterns
    "F821",    # undefined name — dynamic framework / `__all__` patterns

    # ── Line Length ──
    "E501",    # line too long — legacy code and long expressions by design

    # ── Whitespace (handled by formatter) ──
    "W291",    # no trailing whitespace
    "W293",    # blank line contains whitespace

    # ── Unused Arguments (DI constructor / abstract method signatures) ──
    "ARG001",  # unused function argument
    "ARG002",  # unused method argument
    "ARG003",  # unused class argument

    # ── Private Member Access (testing and serialization) ──
    "SLF001",  # private member accessed

    # ── Exception Handling Patterns ──
    "TRY300",  # consider moving this statement to an else block
    "TRY301",  # abstract raise to an inner function
    "TRY003",  # avoid specifying long messages outside the exception class
    "TRY400",  # use logging.exception instead of logging.error
    "TRY401",  # redundant exception object in logging.exception

    # ── Logging ──
    "G201",    # logging.exception should be .error
    "G202",    # logging .exception with traceback
    "G004",    # logging string uses % formatting

    # ── Security (acceptable patterns in this framework) ──
    "S101",    # assert used — expected in pytest and contract checks
    "S104",    # hardcoded binding port
    "S608",    # possible SQL injection via string-based query construction
    "S110",    # try-except-pass detected
    "S105",    # hardcoded password string
    "S106",    # hardcoded password assignment
    "S311",    # standard pseudo-random generator
    "S603",    # subprocess call — check=True is explicit when needed

    # ── Bugbear ──
    "B023",    # function definition does not bind loop variable
    "B024",    # abstract base class but no abstract methods
    "B027",    # empty method in abstract class — allowed in protocols
    "B904",    # within an except clause, raise from None/...
    "B011",    # do not assert False — prefer raise AssertionError
    "B008",    # do not perform function call in default argument — DI patterns

    # ── Pylint Noise ──
    "PLR0913", # too many arguments — legitimate in constructors/configs
    "PLR2004", # magic value in comparison
    "PLR0911", # too many return statements
    "PLR0912", # too many branches
    "PLR0915", # too many statements
    "PLC0414", # useless-import-alias — intentional re-export pattern (`from x import Y as Y`)

    # ── Pyupgrade (intentional patterns) ──
    "UP042",   # prefer StrEnum — project mandates (str, Enum) for compatibility

    # ── Naming (framework intentionally uses these patterns) ──
    "N802",    # function name should be lowercase
    "N803",    # argument name should be lowercase
    "N806",    # variable in function should be lowercase
    "A002",    # argument shadows a Python builtin
    "A003",    # class attribute shadows a Python builtin

    # ── Complexity ──
    "C901",    # function is too complex

    # ── Async ──
    "ASYNC100", # async function with no await — allowed for interface compliance
    "ASYNC109", # async function with timeout parameter — framework timeout patterns
    "ASYNC110", # async busy-wait — framework-specific polling patterns
    "ASYNC230", # blocking open() in async context — explicit async file I/O handled separately
    "ASYNC240", # blocking pathlib method in async context — framework file ops

    # ── Type Annotations ──
    "ANN401",  # dynamically typed `Any` disallowed — too strict for real framework code

    # ── Type Checking Imports (overly strict; annotation-only imports are fine in-line) ──
    "TC001",   # move first-party import into a TYPE_CHECKING block
    "TC002",   # move third-party import into a TYPE_CHECKING block
    "TC003",   # move stdlib import into a TYPE_CHECKING block

    # ── Boolean Argument Trap (valid patterns in framework configuration) ──
    "FBT001",  # boolean positional arg in function definition
    "FBT002",  # boolean default positional arg in function definition
    "FBT003",  # boolean positional value in function call

    # ── Mutable Class Attributes (ClassVar annotation sometimes omitted intentionally) ──
    "RUF012",  # mutable class attributes should be annotated with ClassVar
    "RUF009",  # do not perform function call in dataclass defaults — Pydantic Field() is idiomatic

    # ── Performance (multi-step HTML builders use append deliberately) ──
    "PERF401", # use list comprehension instead of for-loop with append

    # ── Simplify (style preferences, not correctness) ──
    "SIM105",  # use contextlib.suppress(...) instead of try-except-pass
    "SIM102",  # use a single if statement instead of nested ifs
    "SIM117",  # use a single with statement with multiple contexts

    # ── Commented-out Code (in-progress work is commonly commented) ──
    "ERA001",  # found commented-out code

    # ── TODO/FIX Comment Style ──
    "TD002",   # missing author in TODO comment
    "TD003",   # missing issue link in TODO comment
    "FIX002",  # FIX comment: consider resolution

    # ── Shebang ──
    "EXE002",  # shebang is present but file is not executable

    # ── Type: Ignore Comments ──
    "PGH003",  # use specific error codes when ignoring type issues

    # ── Pathlib (open() preference — PTH109/118 selectively handled) ──
    "PTH123",  # use Path.open() instead of builtin open()

    # ── Namespace Packages ──
    "INP001",  # file is part of an implicit namespace package

    # ── Global Statements ──
    "PLW0603", # using the global statement to update a module-level variable

    # ── Loop Variable Reassignment ──
    "PLW2901", # redefined loop variable

    # ── Misc ──
    "F811",    # redefinition of unused name
    "F841",    # local variable is assigned to but never used
    "T201",    # print found
    "EM101",   # exception must not use a string literal
    "EM102",   # exception must not use an f-string literal
    "RUF100",  # unused `noqa` directive
    "RUF002",  # ambiguous unicode character in docstring — legitimate for API docs
    "EXE001",  # shebang present but file not executable — common in dev scripts
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Disallow direct imports of json/orjson — use oridecon.serialization
"json" = { msg = "Use oridecon.serialization instead of standard library json for performance and consistency." }
"orjson" = { msg = "Use oridecon.serialization instead of direct orjson to allow graceful fallback." }

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "TID252"]  # relative imports allowed in __init__.py re-exports
# Demo scripts and notebooks are user-facing examples, not production source
"demos/**" = ["T201", "INP001", "ANN"]
"*.ipynb" = ["T201", "ANN", "INP001", "E402", "F401", "S101", "BLE001"]
# oridecon-contracts has zero external deps — cannot use oridecon.serialization
"core/oridecon-contracts/**" = ["TID251"]
# Serialization implementation must use stdlib json directly (it IS the json layer)
"core/oridecon/src/oridecon/serialization/**" = ["TID251"]
"packages/oridecon-events/src/oridecon/events/webhooks/dispatcher.py" = ["TID251"]
"packages/oridecon-queue/src/oridecon/queue/backends/**" = ["TID251"]
"packages/oridecon-queue/tests/unit/test_tracing_queue_backends.py" = ["TID251"]
"packages/oridecon-resilience/src/oridecon/resilience/circuit/backend.py" = ["TID251"]
"packages/oridecon-tasks/src/oridecon/tasks/dlq/backend.py" = ["TID251"]
"packages/oridecon-tasks/src/oridecon/tasks/results/cache_backend.py" = ["TID251"]
"packages/oridecon-testing/src/oridecon/testing/snapshots.py" = ["TID251"]
"experimental/ai/oridecon-ai-governance/src/oridecon/ai/governance/audit.py" = ["TID251"]
