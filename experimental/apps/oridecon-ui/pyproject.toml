[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "oridecon-ui"
version = "0.1.000"
description = "HTMX/htpy component library for Oridecon web applications"
readme = "README.md"
requires-python = ">=3.11"
keywords = [
    "ui",
    "htmx",
    "htpy",
    "components",
    "web",
    "html",
    "framework",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: User Interfaces",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = [
    "oridecon-contracts>=0.1.4",
    "oridecon>=0.1.4",
    "htpy>=0.9",
    "markupsafe>=2.1",
    "starlette>=1.0.0",
    "httpx>=0.28.1",
    "typer>=0.9.0",
]
authors = [
    { name = "Oridecon Framework Team", email = "team@oridecon.dev" },
]
maintainers = [
    { name = "Oridecon Framework Team", email = "team@oridecon.dev" },
]

[project.license]
text = "MIT"

[project.optional-dependencies]
test = [
    "oridecon-testing>=0.1.4",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]
a11y = [
    "pytest-playwright>=0.6.0",
    "playwright>=1.45.0",
    "httpx>=0.28.1",
    "starlette>=0.37.0",
]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://oridecon.dev"
Repository = "https://github.com/dbtinoy-/oridecon"
Documentation = "https://docs.oridecon.dev"
Issues = "https://github.com/dbtinoy-/oridecon/issues"
Changelog = "https://github.com/dbtinoy-/oridecon/blob/main/CHANGELOG.md"

[project.scripts]
oridecon-ui = "oridecon.ui.cli.add:app"

[dependency-groups]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
test = [
    "oridecon-testing>=0.1.4",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]

[tool.uv.sources.oridecon]
workspace = true

[tool.uv.sources.oridecon-contracts]
workspace = true

[tool.uv.sources.oridecon-testing]
workspace = true

[tool.ruff]
extend = "../../../pyproject.toml"
line-length = 88
target-version = "py311"

[tool.ruff.lint]
extend-ignore = [
    "RUF022",  # `__all__` is not sorted
    "S704",    # markupsafe.Markup used intentionally in template rendering
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["oridecon"]
force-sort-within-sections = true

[tool.mypy]
python_version = "3.11"
namespace_packages = true
explicit_package_bases = true
mypy_path = ["src"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
strict_equality = true

[tool.pytest.ini_options]
addopts = ["--cov=oridecon.ui", "--cov-report=html", "--cov-report=term", "--cov-fail-under=70"]
testpaths = ["tests"]
markers = [
    "integration: mark a test as an integration test",
    "scenario: marks cross-package scenario integration tests",
]

[project.entry-points."oridecon.modules"]
ui = "oridecon.ui.module:UIModule"

[project.entry-points."oridecon.config"]
ui = "oridecon.ui.config:UIConfig"

[project.entry-points."oridecon.providers"]
ui = "oridecon.ui.di.provider:UIProvider"

[tool.hatch.build.targets.wheel]
packages = [
    "src/oridecon",
]
