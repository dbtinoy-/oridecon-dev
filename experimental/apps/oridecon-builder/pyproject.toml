[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oridecon-builder"
version = "0.1.0"
description = "Visual graph-to-code generation framework for Oridecon"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "oridecon>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/oridecon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
# Override root workspace mypy_path to avoid "Source file found twice" error
# when running `mypy src` from within this package directory.
mypy_path = ["src"]
