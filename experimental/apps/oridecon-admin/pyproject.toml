[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "oridecon-admin"
version = "0.1.000"
description = "Modern Python-first admin framework for Oridecon - HTMX, CRUD, dashboards, and extensions"
readme = "README.md"
requires-python = ">=3.11"
keywords = [
    "admin",
    "dashboard",
    "crud",
    "htmx",
    "starlette",
    "htpy",
    "backoffice",
    "framework",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = [
    "oridecon>=0.1.4",
    "oridecon-contracts>=0.1.4",
    "oridecon-ui>=0.1.4",
    "aiofiles>=23.0.0",
    "bcrypt>=4.0.0",
    "htpy>=0.9",
    "orjson>=3.9.0",
    "pydantic>=2.10.0",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2.0",
    "pyyaml>=6.0.3",
    "starlette>=0.28.0",
    "typer>=0.9.0",
    "jinja2>=3.1.0,<4",
    "httpx>=0.27.0",
    "markupsafe>=2.1.5",
    "cryptography>=41.0.0",
    "pyotp>=2.9.0",
    "segno>=1.6.0",
]
authors = [
    { name = "Oridecon Framework Team", email = "team@oridecon.dev" },
]
maintainers = [
    { name = "Oridecon Framework Team", email = "team@oridecon.dev" },
]

[project.license]
text = "MIT"

[project.optional-dependencies]
auth = [
    "oridecon-auth",
    "pysaml2>=7.0.0",
    "xmlsec>=1.3.0",
]
saml = [
    "pysaml2>=7.0.0",
    "xmlsec>=1.3.0",
]
ldap = [
    "ldap3>=2.9.0",
]
oauth2 = [
    "authlib>=1.0.0",
]
export = [
    "openpyxl>=3.0.0",
    "reportlab>=4.0.0",
]
rich-text = [
    "nh3>=0.3.4",
]
cache = [
    "oridecon-cache>=0.1.4",
]
events = [
    "oridecon-events>=0.1.4",
]
web = [
    "oridecon-web>=0.1.4",
]
storage = []
tenancy = [
    "oridecon-tenancy>=0.1.4",
]
monitor = [
    "oridecon-monitor>=0.1.4",
]
search = [
    "oridecon-search>=0.1.4",
]
tasks = [
    "oridecon-tasks>=0.1.4",
]
full = [
    "oridecon-auth",
    "oridecon-cache>=0.1.4",
    "oridecon-events>=0.1.4",
    "oridecon-web>=0.1.4",
    "oridecon-tasks>=0.1.4",
    "pysaml2>=7.0.0",
    "xmlsec>=1.3.0",
    "ldap3>=2.9.0",
    "authlib>=1.0.0",
    "openpyxl>=3.0.0",
    "reportlab>=4.0.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]
dev = [
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://oridecon.dev"
Repository = "https://github.com/dbtinoy-/oridecon"
Documentation = "https://docs.oridecon.dev"
Issues = "https://github.com/dbtinoy-/oridecon/issues"
Changelog = "https://github.com/dbtinoy-/oridecon/blob/main/CHANGELOG.md"

[project.entry-points."oridecon.providers"]
admin = "oridecon.admin.di.bundle_provider:AdminProvider"

[project.entry-points."oridecon.admin.contributors"]
core = "oridecon.admin.contributors.core:CoreAdminContributor"

[project.entry-points."oridecon.modules"]
AdminModule = "oridecon.admin.module:AdminModule"

[project.entry-points."oridecon.config"]
admin = "oridecon.admin.config:AdminConfig"

[project.entry-points."oridecon.web.contributors"]
admin = "oridecon.admin.web.contributor:AdminWebContributor"

[dependency-groups]
dev = [
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
test = [
    "oridecon-testing>=0.1.4",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]

[tool.ruff]
extend = "../../../pyproject.toml"
line-length = 88
target-version = "py311"

[tool.ruff.lint]
extend-ignore = [
    "S301",  # pickle: not used in admin; broad ignore to reduce noise
    "S704",  # markupsafe.Markup used intentionally in template rendering
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "TID252"]
"src/oridecon/admin/ui/atoms/*" = ["N802"]
"src/oridecon/admin/ui/molecules/*" = ["N802"]
"src/oridecon/admin/ui/organisms/*" = ["N802"]
"src/oridecon/admin/ui/columns/*" = ["N802"]
"src/oridecon/admin/ui/layouts/*" = ["N802"]
"tools/**/*" = ["T201", "S", "ERA001", "ANN", "INP001"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["oridecon"]
force-sort-within-sections = true

[tool.mypy]
python_version = "3.13"
namespace_packages = true
explicit_package_bases = true
mypy_path = ["src"]
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
show_error_codes = true
[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = ["--cov=oridecon.admin", "--cov-report=html", "--cov-report=term", "--cov-fail-under=60"]
testpaths = ["tests"]
markers = [
    "integration: mark a test as an integration test",
    "scenario: marks cross-package scenario integration tests",
    "requires_redis: marks tests that require a live Redis connection",
    "requires_postgres: marks tests that require a live PostgreSQL connection",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/oridecon",
]

[project.entry-points."oridecon.cli.contributors"]
admin = "oridecon.admin.cli.contributor:AdminCliContributor"
