<!DOCTYPE html>
<html lang="en"{% block html_attrs %}{% endblock %}>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Oridecon Admin{% endblock %}</title>

    <!-- Favicon -->
    <link rel="icon" href="{% block favicon %}{{ favicon_url | default('data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏠</text></svg>') }}{% endblock %}">

    <!-- Meta -->
    {% block meta %}{% endblock %}

    <!-- Styles: prebuilt + generated shell chrome (no inline style blocks;
         CSP style-src 'self' compatible) -->
    <link rel="stylesheet" href="{{ static_prefix | default('/admin') }}/static/css/tailwind.css">
    <link rel="stylesheet" href="{{ static_prefix | default('/admin') }}/static/css/admin.css">
    <link rel="stylesheet" href="{{ static_prefix | default('/admin') }}/static/css/admin-shell.css">

    <!-- Scripts -->
    <script src="{{ static_prefix | default('/admin') }}/static/js/htmx.min.js"></script>
    <script src="{{ static_prefix | default('/admin') }}/static/js/lucide.min.js"></script>
    <!-- admin-shell.js must load BEFORE alpine.min.js: the vendored Alpine
         build starts on queueMicrotask after its own (deferred) evaluation,
         which happens before the next deferred script runs. The shell picks
         up the alpine:init listener first and registers its controllers
         (commandPalette, notificationBell) before Alpine walks the tree. -->
    <script src="{{ static_prefix | default('/admin') }}/static/js/admin-shell.js" defer></script>
    <script src="{{ static_prefix | default('/admin') }}/static/js/alpine-focus.min.js" defer></script>
    <script src="{{ static_prefix | default('/admin') }}/static/js/alpine.min.js" defer></script>

    <!-- Synchronous head bootstrap: dark mode before first paint + runtime
         theme overrides. All values come from data attributes on <html>. -->
    <script src="{{ static_prefix | default('/admin') }}/static/js/admin-head.js"></script>

    {% block extra_head %}{% endblock %}
</head>

<body class="{% block body_class %}bg-gradient-to-br from-muted via-muted to-muted min-h-screen{% endblock %}" {%
    block body_attrs %}{% endblock %}>
    {% block content %}{% endblock %}

    <!-- Global UI Containers for Overlays -->
    <div id="modal-container"></div>
    <div id="slide-over-container"></div>

    {% block extra_scripts %}{% endblock %}
</body>

</html>
